blueprint:
  name: Low temperature notification
  author: walnuss0815
  domain: automation
  description: >-
    Runs actions when a temperature sensor drops below a threshold.


    [Documentation](https://github.com/walnuss0815/home-assistant-blueprints/blob/main/blueprints/automation/temperature_notification.md)
  source_url: https://github.com/walnuss0815/home-assistant-blueprints/blob/main/blueprints/automation/temperature_notification.yaml
  homeassistant:
    min_version: 2026.7.0
  input:
    sensors:
      name: Temperature sensors
      description: >-
        Sensors, devices, areas, floors or labels to watch. Devices, areas,
        floors and labels also include climate, water heater and weather
        entities.
      selector:
        target:
          entity:
            - domain: sensor
              device_class: temperature
    threshold:
      name: Temperature threshold
      description: The actions run when a sensor drops below this temperature.
      default: 18
      selector:
        number:
          min: -50
          max: 100
          step: 0.5
          mode: box
    unit:
      name: Threshold unit
      description: Unit of the threshold. Readings in another unit are converted.
      default: "°C"
      selector:
        select:
          options:
            - "°C"
            - "°F"
    actions:
      name: Actions
      description: >-
        Notifications or similar to run. Variables: sensor (name), value
        (reading when the threshold was crossed, with unit), area and
        sensor_id (entity ID).
      selector:
        action: {}
    section_options:
      name: Options
      icon: mdi:cog
      collapsed: true
      input:
        hold_time:
          name: Hold time
          description: >-
            The temperature must stay below the threshold this long before the
            actions run. Filters out short drops, e.g. from airing a room. Set
            to 0 to run right away.
          default:
            hours: 0
            minutes: 10
            seconds: 0
          selector:
            duration:

mode: queued
max_exceeded: silent

triggers:
  - trigger: temperature.crossed_threshold
    target: !input sensors
    options:
      threshold:
        type: below
        value:
          number: !input threshold
          unit_of_measurement: !input unit
      behavior: each
      for: !input hold_time

variables:
  sensor_id: "{{ trigger.entity_id }}"
  sensor: "{{ trigger.to_state.name }}"
  # climate and water_heater report current_temperature in the system unit, without a unit attribute
  value: >-
    {%- set s = trigger.to_state -%}
    {%- if s.domain == 'sensor' -%}
      {{ (s.state ~ ' ' ~ s.attributes.unit_of_measurement | default('')) | trim }}
    {%- elif s.domain == 'weather' -%}
      {{ (s.attributes.temperature ~ ' ' ~ s.attributes.temperature_unit | default('')) | trim }}
    {%- else -%}
      {{ s.attributes.current_temperature }}
    {%- endif -%}
  area: "{{ area_name(trigger.entity_id) or '' }}"

actions: !input actions
