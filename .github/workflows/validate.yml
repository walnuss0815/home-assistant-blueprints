name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/check.sh lint

  check-config:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: [pinned, beta]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: scripts/check.sh config
        env:
          HA_VERSION: ${{ matrix.ha == 'beta' && 'beta' || '' }}
