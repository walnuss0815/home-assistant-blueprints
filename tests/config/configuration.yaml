# One test instance pair per blueprint: "<name>_min" (required inputs only)
# and "<name>_full" (every input set). Use fake entity IDs.
# Blueprint paths are relative to blueprints/<domain>/ and live under "repo/".
automation:
  - alias: humidity_notification_min
    use_blueprint:
      path: repo/humidity_notification.yaml
      input:
        sensors:
          entity_id: sensor.bathroom_humidity
        actions:
          - action: persistent_notification.create
            data:
              message: "High humidity: {{ sensor }} {{ value }} ({{ area }})"
  - alias: humidity_notification_full
    use_blueprint:
      path: repo/humidity_notification.yaml
      input:
        sensors:
          entity_id:
            - sensor.cellar_humidity
          area_id: bathroom
          label_id: humidity_alerts
        threshold: 65
        actions:
          - action: persistent_notification.create
            data:
              message: "High humidity: {{ sensor }} {{ value }} ({{ area }})"
        hold_time:
          hours: 0
          minutes: 5
          seconds: 0
  - alias: light_controller_min
    use_blueprint:
      path: repo/light_controller.yaml
      input:
        motion_entities:
          - binary_sensor.motion
        light_entities:
          - light.room
  - alias: light_controller_full
    use_blueprint:
      path: repo/light_controller.yaml
      input:
        motion_entities:
          - binary_sensor.motion
          - binary_sensor.presence
        light_entities:
          - light.room
          - light.room_strip
        operation_mode: auto_on_off
        control_light_settings: true
        day_wait:
          hours: 0
          minutes: 10
          seconds: 0
        brightness_pct: 80
        color_mode: rgb
        color_temp_kelvin: 3000
        rgb_color: [255, 180, 100]
        night_from: "23:00:00"
        night_until: "05:00:00"
        night_lights:
          - light.room_strip
        night_wait:
          hours: 0
          minutes: 2
          seconds: 0
        night_allow_turn_on: false
        night_brightness: 5
        night_color_temp: 2000
        block_on_entities:
          - input_boolean.cinema
        block_on_states:
          - "on"
        block_off_entities:
          - input_boolean.keep_on
        block_off_states:
          - "on"
        block_both_entities:
          - input_boolean.manual
        block_both_states:
          - "on"
        illuminance_sensor: sensor.room_illuminance
        illuminance_threshold: 30
        illuminance_ignore_after_off:
          hours: 0
          minutes: 5
          seconds: 0
        adaptive_lighting_switch: switch.adaptive_lighting_room
        alarm_panel: alarm_control_panel.home
  - alias: mqtt_location_sync_min
    use_blueprint:
      path: repo/mqtt_location_sync.yaml
      input:
        tracked_entity: person.alex
  - alias: mqtt_location_sync_full
    use_blueprint:
      path: repo/mqtt_location_sync.yaml
      input:
        tracked_entity: device_tracker.alex_phone
        topic_prefix: location_sync/home_a
        discovery_prefix: ha_discovery
  - alias: temperature_notification_min
    use_blueprint:
      path: repo/temperature_notification.yaml
      input:
        sensors:
          entity_id: sensor.bedroom_temperature
        actions:
          - action: persistent_notification.create
            data:
              message: "Low temperature: {{ sensor }} {{ value }} ({{ area }})"
  - alias: temperature_notification_full
    use_blueprint:
      path: repo/temperature_notification.yaml
      input:
        sensors:
          entity_id:
            - sensor.garage_temperature
          floor_id: ground_floor
        threshold: 64
        unit: "°F"
        actions:
          - action: persistent_notification.create
            data:
              message: "Low temperature: {{ sensor }} {{ value }} ({{ area }})"
        hold_time:
          hours: 0
          minutes: 5
          seconds: 0
  - alias: zha_tuya_plant_sensor_min
    use_blueprint:
      path: repo/zha_tuya_plant_sensor.yaml
      input:
        plant_name: Ficus
        moisture_entity: sensor.ficus_soil_moisture
        temperature_entity: sensor.ficus_temperature
  - alias: zha_tuya_plant_sensor_full
    use_blueprint:
      path: repo/zha_tuya_plant_sensor.yaml
      input:
        plant_name: Ficus
        moisture_entity: sensor.ficus_soil_moisture
        temperature_entity: sensor.ficus_temperature
        min_moisture: 40
        min_temperature: 15.5
        max_temperature: 30
        hold_time:
          hours: 0
          minutes: 5
          seconds: 0
        min_moisture_actions:
          - action: persistent_notification.create
            data:
              message: "{{ plant_name }} is too dry ({{ moisture }} %)"
        min_temperature_actions:
          - action: persistent_notification.create
            data:
              message: "{{ plant_name }} is too cold ({{ temperature }})"
        max_temperature_actions:
          - action: persistent_notification.create
            data:
              message: "{{ plant_name }} is too warm ({{ temperature }})"
script: {}
